[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; Contraseña Maestra de Administración de Odoo (¡CAMBIAR EN PRODUCCIÓN!)
admin_passwd = admin_master_secret

; Conexión a Base de Datos
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_maxconn = 64

; Soporte para Reverse Proxy HTTPS (Caddy / Nginx)
proxy_mode = True

; Configuración de Procesamiento Multihilo (Workers)
; Para un servidor de 2 vCPU, el valor recomendado es 3 o 5 workers.
workers = 3
max_cron_threads = 2

; Límites de Memoria y Tiempo de Ejecución (Evita congelamientos)
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
