services:
  web:
    image: odoo:18.0
    container_name: ferreteria-web-1
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "8072:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./custom_addons:/mnt/extra-addons
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    command: odoo -c /etc/odoo/odoo.conf
    restart: always

  db:
    image: postgres:15
    container_name: ferreteria-db-1
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: always

volumes:
  odoo-web-data:
  odoo-db-data:
